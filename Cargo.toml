[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.3.0-alpha.20"
edition = "2024"
license = "MIT"
authors = ["Danil Volodin"]

[workspace.dependencies]
jam-core = { path = "crates/jam-core" }
jam-mcp = { path = "crates/jam-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "~0.40.0", features = ["bundled"] }
rusqlite_migration = "~2.6.0"
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
schemars = "1"
rmcp = { version = "~3.5.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri = { version = "~2.12.0" }
rand = "~0.10.0"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.jam-board]
opt-level = "s"

[profile.release.package.jam-mcp-cli]
opt-level = "s"

# MSVC rejects cc-rs /Z7 in this environment (D8050). Keep development builds
# reproducible without embedded debug information; release settings are unchanged.
[profile.dev]
debug = 0
