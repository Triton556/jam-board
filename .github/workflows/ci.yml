name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      perf:
        description: Run hardware-dependent production table benchmark
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Check release version consistency
        run: node scripts/check-versions.mjs && node --test scripts/check-versions.test.mjs scripts/smoke-contracts.test.mjs scripts/smoke-stdio.test.mjs scripts/check-interaction-map.test.mjs
      - name: Prepare sidecar for Tauri resource validation
        run: npm run prepare:sidecar
        working-directory: apps/desktop
      - name: Isolated current MCP contract smoke
        run: node scripts/stdio-smoke.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run check
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - name: Typecheck browser scenarios
        run: npm run typecheck:e2e
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - name: Functional browser scenarios
        if: runner.os == 'Linux'
        run: npx playwright test --project=functional
        working-directory: apps/desktop
      - name: Production table benchmark (manual only)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.perf
        run: npx playwright test --project=perf
        working-directory: apps/desktop
        env:
          JAM_PERF_OUTPUT: ../../.dev-data/ci-perf
      - name: Debug desktop build
        if: runner.os == 'Windows'
        run: npx tauri build --debug --no-bundle
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: .dev-data/playwright
          if-no-files-found: ignore
