name: Draft Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Jam Board ${{ github.ref_name }}
          releaseBody: Unsigned Windows installer. See README for SmartScreen and local data instructions.
          releaseDraft: true
          prerelease: false
      - name: Add checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uploaded = Join-Path $env:RUNNER_TEMP 'jam-uploaded-installers'
          gh release download ${{ github.ref_name }} --pattern '*-setup.exe' --dir $uploaded
          if ($LASTEXITCODE -ne 0) { throw 'Could not read uploaded installer assets' }
          ./scripts/release-checksums.ps1 -LocalDirectory target/release/bundle/nsis -UploadedDirectory $uploaded -OutputPath "$PWD/SHA256SUMS.txt"
          gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
